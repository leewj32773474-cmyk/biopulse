name: BioPulse News Auto-Update
on:
  schedule:
    # '0 * * * *' 대신 '15 * * * *'를 추천합니다. 
    # 정시(0분)에는 전 세계 로봇이 몰려 딜레이가 생길 수 있거든요.
    - cron: '15 * * * *' 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Fetch News
        run: |
          curl "https://gnews.io/api/v4/search?q=biotech+pharma&lang=en&token=${{ secrets.GNEWS_API_KEY }}" > news.json
      - name: Commit and Push
        run: |
          git config --global user.name "BioPulse-Bot"
          git config --global user.email "bot@biopulseglobal.com"
          git add news.json
          git commit -m "Update Latest Bio News" || exit 0
          git push
