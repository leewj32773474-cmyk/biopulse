# .github/workflows/update.yml
# BioPulse Global — Automated News Update Workflow

name: Update BioPulse News

on:
  schedule:
    - cron: '15 * * * *'   # 매시 15분 실행
  workflow_dispatch:         # 수동 실행 버튼 활성화

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # news.json 커밋 권한

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests google-genai

      - name: Run news updater
        env:
          GNEWS_API_KEY:  ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py

      - name: Commit and push news.json
        run: |
          git config user.name  "BioPulse Bot"
          git config user.email "bot@biopulseglobal.com"
          git add news.json
          # 변경사항 없으면 커밋하지 않음
          git diff --cached --quiet || git commit -m "chore: update news $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
