name: BioPulse AI Auto-Update
on:
  schedule:
    - cron: '15 * * * *' 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # v3에서 v4로 업데이트
      - name: Set up Python
        uses: actions/setup-python@v5 # v4에서 v5로 업데이트
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests google-generativeai
      - name: Run AI Analysis
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_news.py
      - name: Commit and Push
        run: |
          git config --global user.name "BioPulse-AI-Bot"
          git config --global user.email "bot@biopulseglobal.com"
          git add news.json
          git commit -m "Update News with AI Analysis" || exit 0
          git push
